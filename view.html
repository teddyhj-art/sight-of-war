<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결과 보기 — 우리 시선 속의 전쟁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1a1a1d;--smoke:#57575c;--ash:#9c9ca1;--paper:#f7f6f2;--card:#232327;--line:#3a3a3f;
--ember:#b3271c;--ember-lt:#ff6b5e;--serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--ink);color:var(--paper);min-height:100vh;font-size:16px;line-height:1.65}
.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 80px}
.hide{display:none!important}
button{font-family:var(--sans);cursor:pointer}
.tag{font-size:12px;letter-spacing:.24em;color:var(--ember-lt);font-weight:700;margin-bottom:8px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,4.2vw,36px)}
.sub{color:var(--ash);font-size:14.5px;margin-top:6px}
.gate{max-width:400px;margin:14vh auto 0;text-align:center}
.gate input{font-size:18px;text-align:center;padding:14px;width:100%;background:var(--card);border:1px solid var(--line);color:var(--paper);border-radius:2px}
.gate input:focus{outline:2px solid var(--ember)}
.btn{background:var(--ember);color:#fff;border:none;font-weight:700;font-size:16px;padding:13px 26px;border-radius:2px;margin-top:14px}
.btn:hover{background:#8f1f16}
.tabs{display:flex;gap:6px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:none;color:var(--ash);font-weight:700;font-size:15px;padding:12px 16px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--paper);border-bottom-color:var(--ember)}
.sec{display:none;padding-top:16px}.sec.on{display:block}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line);color:var(--ash);font-size:13px;font-weight:700;padding:6px 14px;border-radius:16px}
.filters button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.note{background:var(--paper);color:var(--ink);padding:15px 17px;border-radius:3px;font-size:15px;animation:pop .25s}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}
.note .cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--smoke);padding:2px 9px;border-radius:10px;margin-bottom:7px}
.note.c0 .cat{background:#7a2020}.note.c1 .cat{background:#54442a}.note.c2 .cat{background:#2e4a4a}.note.c3 .cat{background:#3d3d5c}.note.c4 .cat{background:#4a3050}
.empty{color:#55555a;padding:40px 0;text-align:center;grid-column:1/-1}
.emap{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:24px;min-height:120px}
.eword{font-family:var(--serif);font-weight:700;color:var(--ash)}
.eword b{color:var(--ember-lt);font-family:var(--sans);font-size:13px;margin-left:5px}
.eword.hot{color:var(--paper)}
.qwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px}
.qcard{background:var(--paper);color:var(--ink);padding:20px;border-radius:3px;animation:pop .25s}
.qcard .team{font-size:12px;font-weight:700;color:var(--ember);letter-spacing:.1em;margin-bottom:6px}
.qcard .qq{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.6}
.stat{color:var(--ash);font-size:13.5px;margin-top:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ash);margin-left:10px}
.live i{width:8px;height:8px;border-radius:50%;background:#4caf6e;display:inline-block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>

<script>
/* ★ index.html과 같은 값 2줄 ★ */
const SB_URL  = 'https://YOUR-PROJECT.supabase.co';
const SB_ANON = 'YOUR-ANON-KEY';
const CATS=['학교폭력·따돌림','혐오표현·조리돌림','차별·비하','관계 단절','온라인'];
</script>

<div class="gate" id="gate">
  <div class="tag">결과 보기 · 읽기 전용</div>
  <h1>우리 시선 속의 전쟁</h1>
  <p class="sub">로그인 없이 학급 결과를 실시간으로 봅니다.<br>승인된 기록만 표시됩니다.</p>
  <div style="margin-top:24px"><input type="text" id="gClass" placeholder="반 코드 (예: 201)" onkeydown="if(event.key==='Enter')enter()"></div>
  <button class="btn" onclick="enter()">보기</button>
</div>

<div class="wrap hide" id="app">
  <div class="tag"><span id="vClass"></span>반 · 읽기 전용<span class="live"><i></i>실시간</span></div>
  <h1>학급 결과 보드</h1>
  <div class="tabs">
    <button class="on" data-t="sBoard">목격 보드</button>
    <button data-t="sEmo">감정 지도</button>
    <button data-t="sQ">모둠 질문</button>
  </div>

  <div class="sec on" id="sBoard">
    <div class="filters" id="filters">
      <button class="on" data-f="-1">전체</button><button data-f="0">학교폭력</button><button data-f="1">혐오표현</button><button data-f="2">차별·비하</button><button data-f="3">관계 단절</button><button data-f="4">온라인</button>
    </div>
    <div class="board" id="board"></div>
    <p class="stat" id="cardStat"></p>
  </div>

  <div class="sec" id="sEmo">
    <div class="emap" id="emap"></div>
    <p class="stat" id="emoStat"></p>
  </div>

  <div class="sec" id="sQ">
    <div class="qwall" id="qwall"></div>
  </div>
</div>

<script>
const sb=supabase.createClient(SB_URL,SB_ANON);
let CLASS='',cards=[],votes=[],qs=[],filter=-1;
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML;};

const params=new URLSearchParams(location.search);
if(params.get('class')){$('gClass').value=params.get('class');}

function enter(){
  const c=$('gClass').value.trim();if(!c)return;
  CLASS=c;$('gate').classList.add('hide');$('app').classList.remove('hide');
  $('vClass').textContent=c;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
    b.classList.add('on');$(b.dataset.t).classList.add('on');
  });
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');filter=+b.dataset.f;renderBoard();
  });
  loadAll();
  sb.channel('view-'+CLASS)
    .on('postgres_changes',{event:'*',schema:'public',table:'witness_cards',filter:'class_code=eq.'+CLASS},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'emotion_votes',filter:'class_code=eq.'+CLASS},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'team_questions',filter:'class_code=eq.'+CLASS},loadAll)
    .subscribe();
}
async function loadAll(){
  const[c,e,q]=await Promise.all([
    sb.from('witness_cards').select('*').eq('class_code',CLASS).order('created_at'),   // RLS가 승인분만 반환
    sb.from('emotion_votes').select('*').eq('class_code',CLASS),
    sb.from('team_questions').select('*').eq('class_code',CLASS).order('created_at')
  ]);
  cards=c.data||[];votes=e.data||[];qs=q.data||[];
  renderBoard();renderEmo();renderQ();
}
function renderBoard(){
  const show=cards.filter(n=>filter<0||n.category===filter);
  $('board').innerHTML=show.length?show.map(n=>
    `<div class="note c${n.category}"><span class="cat">${CATS[n.category]}</span><div>${esc(n.content)}</div></div>`
  ).join(''):'<div class="empty">'+(cards.length?'이 유형의 카드가 없습니다.':'승인된 목격 카드가 아직 없습니다.')+'</div>';
  $('cardStat').textContent=cards.length?`승인된 기록 ${cards.length}개`:'';
}
function renderEmo(){
  const m={};votes.forEach(v=>m[v.emotion]=(m[v.emotion]||0)+1);
  const es=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  $('emap').innerHTML=es.length?es.map(([e,n])=>
    `<span class="eword ${n>=3?'hot':''}" style="font-size:${Math.min(18+n*4,58)}px">${esc(e)}<b>${n}</b></span>`
  ).join(''):'<div class="empty">아직 감정 투표가 없습니다.</div>';
  $('emoStat').textContent=votes.length?`총 ${votes.length}표 · ${es.length}개 감정`:'';
}
function renderQ(){
  $('qwall').innerHTML=qs.length?qs.map(q=>
    `<div class="qcard"><div class="team">${esc(q.team||'무명 모둠')}</div><div class="qq">${esc(q.content)}</div></div>`
  ).join(''):'<div class="empty">모둠 질문이 아직 없습니다.</div>';
}
</script>
</body>
</html>
